         otherwise follow the system. Admin default_color_mode refines this
         after settings load (lib/colorMode.js) when the visitor hasn't chosen. */
      (function () {
        try {
          var m = localStorage.getItem('kfk_color_mode');
          var dark = m === 'dark' || (m !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var r = document.documentElement;
          if (dark) r.classList.add('dark'); else r.classList.remove('dark');
          r.style.colorScheme = dark ? 'dark' : 'light';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#0F172A' : '#581C87');
        } catch (e) {}
      })();
    </script>
