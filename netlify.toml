[build]
  # Robust to Netlify UI Base directory = "mobile" or "" — build script auto-detects repo root
  command = "sh netlify-build.sh || sh ../netlify-build.sh"
  publish = "frontend/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  NPM_CONFIG_CACHE = "/opt/buildhome/.npm"
  NPM_CONFIG_AUDIT = "false"
  NPM_CONFIG_FUND = "false"

[functions]
  node_bundler = "esbuild"
  # OCR cold start (11MB langdata download + tesseract recognize) needs time;
  # the platform default synchronous execution limit is 60s and timeout_ms is
  # NOT a valid [functions] site-level key (config parser rejects it as
  # "must be an object" — it's read as a per-function table name).
  external_node_modules = [
    "@prisma/client",
    "@prisma/engines",
    ".prisma",
    "bcryptjs",
    "cors",
    "dotenv",
    "express",
    "helmet",
    "jsonwebtoken",
    "multer",
    "nodemailer",
    "serverless-http",
    "pdf-lib",
    "sharp",
    "svgo",
    "tesseract.js",
    "tesseract.js-core",
    "unpdf",
    "xlsx",
    "zod"
  ]

# Static assets must 404, not rewrite to SPA
[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/health"
  status = 200

# robots.txt points here — serve the dynamic sitemap (products + published posts).
# Netlify does not chain 200-rewrites, so /sitemap.xml goes straight to the
# function (which also serves it at /sitemap.xml, see app.js). force=true:
# the UI sitemap build plugin writes a static homepage-only sitemap.xml that
# would otherwise shadow this.
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/api"
  status = 200
  force = true

# Renamed blog slug (terminology sweep 2026-10-18) — keep old links alive.
[[redirects]]
  from = "/blog/behind-armature-wire"
  to = "/blog/behind-the-wire"
  status = 301

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ── AI-agent Markdown edge function (netlify/edge-functions/markdown.ts) ──
# Serves text/markdown only when Accept: text/markdown is sent; everyone else
# passes through unchanged. Scope = content pages (blog, shop, product,
# occasions, workshop/about/privacy/loyalty landing copy). Utility routes are
# excluded by omission: cart, checkout, login, configurator, notebook, admin,
# pos, kanban, /api/*, /assets/*.
# Add a path: add another [[edge_functions]] block below (or a new path entry).
# Remove: delete its block. Then redeploy — no code changes needed.
[[edge_functions]]
  path = "/"
  function = "markdown"

[[edge_functions]]
  path = "/shop"
  function = "markdown"

[[edge_functions]]
  path = "/blog"
  function = "markdown"

[[edge_functions]]
  path = "/blog/*"
  function = "markdown"

[[edge_functions]]
  path = "/product/*"
  function = "markdown"

[[edge_functions]]
  path = "/occasions/*"
  function = "markdown"

[[edge_functions]]
  path = "/workshops"
  function = "markdown"

[[edge_functions]]
  path = "/about"
  function = "markdown"

[[edge_functions]]
  path = "/privacy"
  function = "markdown"

[[edge_functions]]
  path = "/loyalty"
  function = "markdown"

# ── Per-route OG/Twitter meta edge function (netlify/edge-functions/meta.ts) ──
# Rewrites <head> og:/twitter:/canonical for link-preview bots only (FB,
# WhatsApp, Twitter, Slack, Googlebot, …) — humans get a zero-cost pass-through.
# Same paths as markdown; Netlify chains every matching edge function in
# declaration order, so keep these blocks AFTER the markdown blocks above.
[[edge_functions]]
  path = "/"
  function = "meta"

[[edge_functions]]
  path = "/shop"
  function = "meta"

[[edge_functions]]
  path = "/blog"
  function = "meta"

[[edge_functions]]
  path = "/blog/*"
  function = "meta"

[[edge_functions]]
  path = "/product/*"
  function = "meta"

[[edge_functions]]
  path = "/occasions/*"
  function = "meta"

[[edge_functions]]
  path = "/workshops"
  function = "meta"

[[edge_functions]]
  path = "/about"
  function = "meta"

[[edge_functions]]
  path = "/privacy"
  function = "meta"

[[edge_functions]]
  path = "/loyalty"
  function = "meta"

# ── Public-API edge cache (netlify/edge-functions/apiCache.ts) ──
# Caches anonymous GET responses at the CDN (60s + SWR) — the function↔DB
# latency (US functions, Sydney DB) makes uncached reads 2-7s. Authed/cookie
# requests and non-GETs bypass; cart/checkout/auth/orders are not registered.
# cache = "manual" opts in; the handler adds Netlify-CDN-Cache-Control.
[[edge_functions]]
  path = "/api/products"
  function = "apiCache"
  cache = "manual"

[[edge_functions]]
  path = "/api/products/*"
  function = "apiCache"
  cache = "manual"

[[edge_functions]]
  path = "/api/posts"
  function = "apiCache"
  cache = "manual"

[[edge_functions]]
  path = "/api/posts/*"
  function = "apiCache"
  cache = "manual"

[[edge_functions]]
  path = "/api/collections"
  function = "apiCache"
  cache = "manual"

[[edge_functions]]
  path = "/api/collections/*"
  function = "apiCache"
  cache = "manual"

[[edge_functions]]
  path = "/api/workshops"
  function = "apiCache"
  cache = "manual"

[[edge_functions]]
  path = "/api/workshops/*"
  function = "apiCache"
  cache = "manual"

[[edge_functions]]
  path = "/api/settings"
  function = "apiCache"
  cache = "manual"
