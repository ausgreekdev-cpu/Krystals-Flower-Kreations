[build]
  # Robust to Netlify UI Base directory = "mobile" or "" — build script auto-detects repo root
  command = "sh netlify-build.sh || sh ../netlify-build.sh"
  publish = "frontend/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  NPM_CONFIG_CACHE = "/opt/buildhome/.npm"
  NPM_CONFIG_AUDIT = "false"
  NPM_CONFIG_FUND = "false"

[functions]
  node_bundler = "esbuild"
  external_node_modules = [
    "@prisma/client",
    "@prisma/engines",
    ".prisma",
    "bcryptjs",
    "cors",
    "dotenv",
    "express",
    "helmet",
    "jsonwebtoken",
    "multer",
    "nodemailer",
    "serverless-http",
    "sharp",
    "zod"
  ]

# Static assets must 404, not rewrite to SPA
[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/health"
  status = 200

# robots.txt points here — serve the dynamic sitemap (products + published posts).
# Netlify does not chain 200-rewrites, so /sitemap.xml goes straight to the
# function (which also serves it at /sitemap.xml, see app.js). force=true:
# the UI sitemap build plugin writes a static homepage-only sitemap.xml that
# would otherwise shadow this.
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ── AI-agent Markdown edge function (netlify/edge-functions/markdown.ts) ──
# Serves text/markdown only when Accept: text/markdown is sent; everyone else
# passes through unchanged. Scope = content pages (blog, shop, product,
# occasions, workshop/about/privacy/loyalty landing copy). Utility routes are
# excluded by omission: cart, checkout, login, configurator, notebook, admin,
# pos, kanban, /api/*, /assets/*.
# Add a path: add another [[edge_functions]] block below (or a new path entry).
# Remove: delete its block. Then redeploy — no code changes needed.
[[edge_functions]]
  path = "/"
  function = "markdown"

[[edge_functions]]
  path = "/shop"
  function = "markdown"

[[edge_functions]]
  path = "/blog"
  function = "markdown"

[[edge_functions]]
  path = "/blog/*"
  function = "markdown"

[[edge_functions]]
  path = "/product/*"
  function = "markdown"

[[edge_functions]]
  path = "/occasions/*"
  function = "markdown"

[[edge_functions]]
  path = "/workshops"
  function = "markdown"

[[edge_functions]]
  path = "/about"
  function = "markdown"

[[edge_functions]]
  path = "/privacy"
  function = "markdown"

[[edge_functions]]
  path = "/loyalty"
  function = "markdown"
