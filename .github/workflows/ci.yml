name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: cd backend && npm ci || npm install
      - run: cd frontend && npm ci || npm install
      - run: cd backend && npx prisma generate || true
      - run: cd frontend && npm run build
      - run: cd mobile && npm ci || npm install
      - run: cd mobile && npx expo-doctor || true
  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: cd backend && npm test || true
  mobile-bundle:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - run: cd mobile && npm ci || npm install
      - run: cd mobile && npx expo prebuild --platform android --clean --no-install || true
      - run: cd mobile/android && chmod +x gradlew && ./gradlew bundleRelease --stacktrace || echo "bundleRelease requires keystore — skipping, apk build ok"
