name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci --workspace=backend --workspace=frontend --include=dev
      - run: cd backend && npm run lint
      - run: cd frontend && npm run lint
      - run: cd backend && npx prisma generate
      - run: npm run build --workspace=frontend
      - run: cd mobile && npm ci
      - run: cd mobile && npx expo-doctor

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: krystal
          POSTGRES_PASSWORD: krystal_dev_password
          POSTGRES_DB: krystals_flower_kreations
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U krystal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://krystal:krystal_dev_password@127.0.0.1:5432/krystals_flower_kreations?schema=public
      DIRECT_URL: postgresql://krystal:krystal_dev_password@127.0.0.1:5432/krystals_flower_kreations?schema=public
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci --workspace=backend --include=dev
      - run: cd backend && npx prisma db push --skip-generate
      - run: cd backend && npm run seed
      - run: cd backend && npm test